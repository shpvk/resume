name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check (.astro + .ts)
        run: npx astro check

      - name: Format check
        run: npx prettier --check "**/*.{astro,ts,tsx,css,json,md}"

      - name: Build
        run: npx astro build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
